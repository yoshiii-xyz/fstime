[package]
name = "fstime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A bounded, explainable filesystem tree traversal profiler"
license = "MIT"
repository = "https://github.com/joshiii-xyz/fstime"
keywords = ["filesystem", "profiling", "traversal", "performance", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
